<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#050507;--side:#0A0A10;--panel:#0F0F16;--panel2:#171722;--ink:#F3F3FA;--mute:#8A8AA3;--line:#23232F;
  --violet:#8B5CF6;--cyan:#22D3EE;--pink:#F472B6;--amber:#FBBF24;--green:#34D399;--danger:#FB7185;
  --grad:linear-gradient(135deg,#22D3EE,#8B5CF6 55%,#F472B6);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh}
svg{width:18px;height:18px;flex:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:0;width:100%;resize:none}
::placeholder{color:#5E5E75}
 
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
 
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff}
.brand b{display:block;font:800 18px/1.1 "Bricolage Grotesque",sans-serif}
.brand span{color:var(--mute);font-size:12px}
nav{display:grid;gap:4px}
nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;text-align:left;transition:background .15s,color .15s}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button[aria-pressed="true"]{background:color-mix(in srgb,var(--violet) 20%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--violet)}
nav .n{margin-left:auto;font-size:12px;background:var(--panel2);padding:1px 8px;border-radius:99px}
.status{margin-top:auto;display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.bad{background:var(--danger)}
 

main{padding:36px clamp(18px,4vw,44px) 70px;max-width:900px;width:100%;background:radial-gradient(700px 320px at 90% -5%,rgba(139,92,246,.18),transparent 60%),radial-gradient(500px 280px at 10% 0%,rgba(34,211,238,.10),transparent 60%)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px}
.eyebrow{color:var(--cyan);font-size:13px;font-weight:600}
h1{font:800 clamp(30px,5vw,40px)/1.1 "Bricolage Grotesque",sans-serif;margin:2px 0 0;letter-spacing:-.02em}
.primary{display:flex;align-items:center;gap:6px;background:var(--grad);color:#fff;font-weight:600;padding:10px 18px;border-radius:12px;transition:filter .15s,transform .1s}
.primary:hover{filter:brightness(1.12)}
.primary:active{transform:scale(.97)}
.primary svg{width:16px;height:16px}
 
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px 16px}
.stat span{color:var(--mute);font-size:13px}
.stat b{display:block;font:800 30px/1.15 "Bricolage Grotesque",sans-serif;color:var(--c)}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .4s}
 
.searchrow{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mute);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.search input{padding:11px 0}
.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--mute);transition:background .15s,color .15s}
.icon:hover{background:var(--panel2);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
.refresh{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:46px;height:auto}
 
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;transition:border-color .2s,transform .15s}
.task:hover{border-color:var(--c);transform:translateY(-1px)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:transparent;margin-top:2px;transition:background .15s,box-shadow .15s}
.chk:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.chk svg{width:14px;height:14px}
.task.done{--c:var(--green)!important}
.task.done .chk{background:var(--green);color:#04130C;box-shadow:0 0 12px rgba(52,211,153,.5)}
.title{font-weight:600;font-size:16px;overflow-wrap:anywhere;background:linear-gradient(currentColor,currentColor) 0 55%/0 2px no-repeat;transition:background-size .25s,color .25s;display:inline}
.task.done .title{color:var(--mute);background-size:100% 2px}
.body{color:var(--mute);margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:14px}
.meta{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;color:var(--amber);background:rgba(251,191,36,.14)}
.task.done .badge{color:var(--green);background:rgba(52,211,153,.14)}
.date{font-size:12px;color:var(--mute)}
.acts{display:flex;gap:2px}
.empty{padding:40px 20px;text-align:center;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:14px}
 
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(480px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
dialog form{padding:22px;display:grid;gap:12px}
dialog h2{margin:0;font:800 22px "Bricolage Grotesque",sans-serif}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s}
.field:focus-within{border-color:var(--violet)}
.field label{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.err{color:var(--danger);font-size:14px;min-height:20px}
.btns{display:flex;justify-content:flex-end;gap:8px}
.btns .cancel{padding:10px 16px;border-radius:12px;color:var(--mute)}
.btns .cancel:hover{background:var(--panel2);color:var(--ink)}
.btns .primary{border:0}
 
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px;gap:12px}
  nav{display:flex;width:100%;order:3;overflow-x:auto}
  nav button{white-space:nowrap}
  .status{display:none}
}
@media (max-width:480px){.stats{gap:8px}.stat{padding:10px 12px}.stat b{font-size:24px}.top .primary span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div><b>Todo List</b><span>Stay on top of things</span></div>
    </div>
    <nav id="nav" aria-label="Filter todos"></nav>
    <div class="status"><i class="dot" id="dot"></i><span id="statusText">Connecting...</span></div>
  </aside>
 
  <main>
    <div class="top">
      <div>
        <div class="eyebrow">Your tasks</div>
        <h1 id="greet">Good day</h1>
      </div>
      <button class="primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New Task</span></button>
    </div>
 
    <div class="stats">
      <div class="stat" style="--c:var(--violet)"><span>Total</span><b id="sTotal">0</b></div>
      <div class="stat" style="--c:var(--amber)"><span>In progress</span><b id="sActive">0</b></div>
      <div class="stat" style="--c:var(--green)"><span>Completed</span><b id="sDone">0</b></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
 
    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" placeholder="Search by title or details..." aria-label="Search">
        <button class="icon" id="clearBtn" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </label>
      <button class="icon refresh" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    </div>
 
    <ul id="list"></ul>
  </main>
</div>
 
<dialog id="dlg">
  <form id="form">
    <h2 id="dlgTitle">New task</h2>
    <div class="field"><label for="fTitle">Title</label><input id="fTitle" maxlength="100" placeholder="What needs doing?"></div>
    <div class="field"><label for="fBody">Details (optional)</label><textarea id="fBody" rows="3" maxlength="500" placeholder="Add more info..."></textarea></div>
    <div class="err" id="error" role="alert"></div>
    <div class="btns">
      <button type="button" class="cancel" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="saveBtn">Add task</button>
    </div>
  </form>
</dialog>
 
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const I = {
  check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  active: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
};
const COLORS = ["var(--cyan)", "var(--violet)", "var(--pink)", "var(--amber)"];
 
let todos = [];
let matchIds = null;     
let filter = "all";      
let searchTerm = "";
let editingId = null;
let timer;
 
async function request(path = "", options = {}) {
  const res = await fetch("/todo" + path, { headers: { "Content-Type": "application/json" }, ...options });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = Array.isArray(json.error) ? json.error.join(", ") : json.error;
    throw new Error(msg || "Something went wrong");
  }
  return json;
}
 
function setStatus(ok) {
  $("dot").className = "dot " + (ok ? "ok" : "bad");
  $("statusText").textContent = ok ? "API connected locally" : "API not reachable";
}
 
async function loadAll() {
  try {
    todos = (await request()).data.sort((a, b) => b.id - a.id); 
    matchIds = searchTerm
      ? new Set((await request("?search=" + encodeURIComponent(searchTerm))).data.map((t) => t.id))
      : null;
    setStatus(true);
    render();
  } catch (err) {
    setStatus(false);
    $("list").innerHTML = `<li class="empty">${esc(err.message)}</li>`;
  }
}
 
function render() {
  const done = todos.filter((t) => t.done).length;
  const active = todos.length - done;
  $("sTotal").textContent = todos.length;
  $("sActive").textContent = active;
  $("sDone").textContent = done;
  $("bar").style.width = todos.length ? Math.round((done / todos.length) * 100) + "%" : "0%";
 
  $("nav").innerHTML = [["all", "All Tasks", todos.length], ["active", "Active", active], ["done", "Completed", done]]
    .map(([k, label, n]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${I[k]}${label}<span class="n">${n}</span></button>`).join("");
 
  const shown = todos.filter((t) =>
    (filter === "all" || (filter === "done") === t.done) && (!matchIds || matchIds.has(t.id)));
 
  if (!shown.length) {
    const msg = searchTerm ? "No tasks match your search." : todos.length ? "Nothing here. Try another filter." : "No tasks yet. Click New Task to add your first one.";
    $("list").innerHTML = `<li class="empty">${msg}</li>`;
    return;
  }
 
  $("list").innerHTML = shown.map((t) => {
    const date = new Date(t.created_at).toLocaleDateString([], { dateStyle: "medium" });
    return `<li class="task ${t.done ? "done" : ""}" style="--c:${COLORS[t.id % COLORS.length]}">
      <button class="chk" data-act="toggle" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="Mark ${t.done ? "not done" : "done"}">${I.check}</button>
      <div>
        <span class="title">${esc(t.title)}</span>
        ${t.body ? `<p class="body">${esc(t.body)}</p>` : ""}
        <div class="meta"><span class="badge">${t.done ? "Completed" : "In progress"}</span><span class="date">${date}</span></div>
      </div>
      <div class="acts">
        <button class="icon" data-act="edit" data-id="${t.id}" aria-label="Edit">${I.edit}</button>
        <button class="icon del" data-act="delete" data-id="${t.id}" aria-label="Delete">${I.trash}</button>
      </div></li>`;
  }).join("");
}
 
const dlg = $("dlg");
function openModal(todo) {
  editingId = todo ? todo.id : null;
  $("dlgTitle").textContent = todo ? "Edit task" : "New task";
  $("saveBtn").textContent = todo ? "Save changes" : "Add task";
  $("fTitle").value = todo ? todo.title : "";
  $("fBody").value = todo ? todo.body || "" : "";
  $("error").textContent = "";
  dlg.showModal();
  $("fTitle").focus();
}
$("newBtn").addEventListener("click", () => openModal());
$("cancelBtn").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // click outside
 
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const title = $("fTitle").value.trim();
  const body = $("fBody").value;
  if (!title) { $("error").textContent = "Enter a title for the task."; return; }
  try {
    if (editingId) await request(`/${editingId}`, { method: "PATCH", body: JSON.stringify({ title, body }) });
    else await request("", { method: "POST", body: JSON.stringify({ title, body }) });
    dlg.close();
    await loadAll();
  } catch (err) {
    $("error").textContent = err.message;
  }
});
 
$("list").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn || !btn.dataset.act) return;
  const id = Number(btn.dataset.id);
  try {
    if (btn.dataset.act === "toggle") {
      const json = await request(`/${id}/toggle`, { method: "PATCH" });
      todos = todos.map((t) => (t.id === id ? json.data : t));
      render();
    } else if (btn.dataset.act === "edit") {
      openModal(todos.find((t) => t.id === id));
    } else if (btn.dataset.act === "delete") {
      if (!confirm("Delete this task?")) return;
      await request(`/${id}`, { method: "DELETE" });
      await loadAll();
    }
  } catch (err) {
    alert(err.message);
  }
});
 
$("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { filter = b.dataset.filter; render(); }
});
 
$("search").addEventListener("input", (e) => {
  $("clearBtn").hidden = !e.target.value;
  clearTimeout(timer);
  timer = setTimeout(() => { searchTerm = e.target.value.trim(); loadAll(); }, 300);
});
$("clearBtn").addEventListener("click", () => {
  $("search").value = "";
  $("clearBtn").hidden = true;
  searchTerm = "";
  loadAll();
  $("search").focus();
});
$("refreshBtn").addEventListener("click", loadAll);
 
const h = new Date().getHours();
$("greet").textContent = (h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + " 👋";
loadAll();
</script>
</body>
</html>
